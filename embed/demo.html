<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafeh Booking — Local Demo</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #111; }
    header { background: #fff; border-bottom: 1px solid #e5e5e7; padding: 18px 32px; }
    header h1 { margin: 0; font-size: 18px; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }
    main h2 { font-size: 24px; margin: 0 0 6px; }
    main p  { color: #52525b; margin: 0 0 24px; }
  </style>
</head>
<body>

<header><h1>Local Host Test Page</h1></header>

<main>
  <h2>Kafeh Booking Widget</h2>
  <p>Self-contained snippet — opens kafeh-booking.html in an iframe so you can test it standalone.</p>

  <iframe src="kafeh-booking.html"
          style="width:100%; min-height:1400px; border:0; background:transparent;"
          id="kfbFrame"></iframe>
</main>

<script>
  // Vendor scripts must be loaded in the iframe's window too.
  // Easiest: inject them into the iframe after load.
  var f = document.getElementById("kfbFrame");
  f.addEventListener("load", function () {
    var d = f.contentDocument;
    var w = f.contentWindow;
    // jQuery
    var jq = d.createElement("script");
    jq.src = "https://code.jquery.com/jquery-3.7.1.min.js";
    jq.onload = function () {
      // PayPal SDK
      var pp = d.createElement("script");
      pp.src = "https://www.paypal.com/sdk/js?client-id=sb&currency=USD&intent=capture";
      d.head.appendChild(pp);
      // Google Maps
      w.KAFEH_API = "http://localhost/kafeh-api";
      w.KAFEH_PAYPAL_CLIENT_ID = "sb";
      var g = d.createElement("script");
      g.src = "https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_KEY&libraries=places&callback=kfbInitMap";
      g.async = true; g.defer = true;
      d.head.appendChild(g);
    };
    d.head.appendChild(jq);
  });
</script>

</body>
</html>
